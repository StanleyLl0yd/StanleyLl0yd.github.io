name: Bootstrap security hardening

on:
  push:
    branches:
      - security/full-hardening

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Apply deterministic hardening
        run: python3 scripts/apply_security_hardening.py

      - name: Commit hardening changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply static site security hardening"
          git push
