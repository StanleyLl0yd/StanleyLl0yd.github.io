name: Import Biorhythms screenshots

on:
  push:
    branches:
      - portfolio/biorhythms-real-screenshots

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.2
        with:
          ref: portfolio/biorhythms-real-screenshots

      - name: Download and verify authoritative artifact
        env:
          ARTIFACT_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-8414-822f-b012-422b4fe447c4/raw?se=2026-09-17T09%3A15%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=591b040b-f388-5db9-97da-8abb302a0db7&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T06%3A23%3A17Z&ske=2026-09-18T06%3A23%3A17Z&sks=b&skv=2026-02-06&sig=eUtRZYofY3bUo6KZKOxljSm8Va5xHzmK7Cj84DXG0%2BE%3D"
          EXPECTED_SHA256: "61e4b9b53dcc94e55f859a0e1890c4e1230a0dcef5cd5573d3adf4def2649adc"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/biorhythms.zip
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/biorhythms.zip | sha256sum --check --strict
          mkdir -p assets/screenshots/biorhythms /tmp/biorhythms-artifact
          unzip -q /tmp/biorhythms.zip -d /tmp/biorhythms-artifact
          src=/tmp/biorhythms-artifact/reports/androidTests/connected/store-screenshots
          for file in 01_today.png 02_7_days.png 03_notifications.png 04_about.png 05_widget.png; do
            test -f "$src/$file"
            cp "$src/$file" "assets/screenshots/biorhythms/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          root = Path('assets/screenshots/biorhythms')
          expected = ['01_today.png','02_7_days.png','03_notifications.png','04_about.png','05_widget.png']
          actual = sorted(p.name for p in root.glob('*.png'))
          assert actual == sorted(expected), (actual, expected)
          for name in expected:
              data = (root/name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (1080, 1920), (name, width, height)
              print(name, width, height, len(data))
          PY

      - name: Commit verified assets and remove importer
        run: |
          set -euo pipefail
          rm .github/workflows/import-biorhythms-screenshots.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screenshots/biorhythms .github/workflows/import-biorhythms-screenshots.yml
          git commit -m 'Import verified Biorhythms 1.7.0 screenshots'
          git push origin HEAD:portfolio/biorhythms-real-screenshots
