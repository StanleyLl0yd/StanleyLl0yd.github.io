name: Import Everon screenshots (temporary)

on:
  push:
    branches:
      - portfolio/everon-real-gallery-2026-09-18

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Download and verify Everon v2.8.2 screenshots
        env:
          ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-ac38-8243-8e24-60e9b0f6f381/raw?se=2026-09-18T08%3A41%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=8bc87447-4e1c-58c1-a5bb-98e6382fb98b&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T07%3A09%3A45Z&ske=2026-09-19T07%3A09%3A45Z&sks=b&skv=2026-02-06&sig=kjt7tDjxnv8jUZWU/lB/RofuuxUIJI%2B241wEAixKKeQ%3D'
          EXPECTED_ZIP_SHA256: '3b6574d65376c9225880b6e99ae9e27ae32f9274db8a9fbeee317077b528b6a9'
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/everon-import"
          mkdir -p "$tmp/raw" assets/screenshots/everon
          curl --fail --location --retry 2 "$ARTIFACT_URL" --output "$tmp/screenshots.zip"
          echo "$EXPECTED_ZIP_SHA256  $tmp/screenshots.zip" | sha256sum --check -
          unzip -q "$tmp/screenshots.zip" -d "$tmp/raw"
          python3 - "$tmp/raw" <<'PY'
          import pathlib, struct, sys
          root = pathlib.Path(sys.argv[1])
          expected = {"01-settings.png", "02-tray-menu.png", "03-about.png", "SCREENSHOTS-SHA256.txt"}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          assert actual == expected, (actual, expected)
          expected_dims = {
              "01-settings.png": (594, 680),
              "02-tray-menu.png": (187, 165),
              "03-about.png": (454, 320),
          }
          for name, dims in expected_dims.items():
              data = (root / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == dims, (name, width, height, dims)
          PY
          cp "$tmp/raw/"0*.png assets/screenshots/everon/

      - name: Commit verified assets and remove importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/everon
          git rm .github/workflows/import-everon-screenshots-temp.yml
          git commit -m "Add verified Everon v2.8.2 screenshots"
          git push origin HEAD:portfolio/everon-real-gallery-2026-09-18
