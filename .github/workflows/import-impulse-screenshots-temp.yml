name: Import IMPULSE screenshots (temporary)

on:
  push:
    branches:
      - portfolio/impulse-real-gallery-2026-09-18

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Download and verify IMPULSE 1.1.0 screenshots
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-3714-81f4-815e-579b9b8de169/raw?se=2026-09-18T07%3A57%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=658834dd-c520-5dd1-aee5-5c2e49bddf20&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A11%3A58Z&ske=2026-09-18T18%3A11%3A58Z&sks=b&skv=2026-02-06&sig=yZReFNoEZh06tr3Y4MKAfQOpYuhDSzPd8lmmSfTB5uI%3D'
          EXPECTED_ZIP_SHA256: '4b374638db08eb369620b1c3fb45968818323730a2e7b59578f28b9aa45476e5'
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/impulse-import"
          mkdir -p "$tmp/raw" assets/screenshots/impulse
          curl --fail --location --retry 2 "$ARTIFACT_URL" --output "$tmp/screenshots.zip"
          echo "$EXPECTED_ZIP_SHA256  $tmp/screenshots.zip" | sha256sum --check -
          unzip -q "$tmp/screenshots.zip" -d "$tmp/raw"
          python3 - "$tmp/raw" <<'PY'
          import pathlib, struct, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              "00_menu.png",
              "01_gameplay.png",
              "02_campaign.png",
              "03_endless.png",
              "04_daily.png",
              "05_achievements.png",
              "06_settings.png",
          }
          actual = {p.name for p in root.iterdir() if p.is_file()}
          assert actual == expected, (actual, expected)
          for name in sorted(expected):
              data = (root / name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", name
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (1080, 1920), (name, width, height)
          PY
          cp "$tmp/raw/"*.png assets/screenshots/impulse/

      - name: Commit verified assets and remove importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/impulse
          git rm .github/workflows/import-impulse-screenshots-temp.yml
          git commit -m "Add verified IMPULSE 1.1.0 screenshots"
          git push origin HEAD:portfolio/impulse-real-gallery-2026-09-18
