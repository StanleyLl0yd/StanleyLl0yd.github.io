name: Import Password Generator screenshots

on:
  push:
    branches:
      - portfolio/password-generator-real-gallery-2026-09-16

permissions:
  contents: write

jobs:
  import-screenshots:
    name: import-screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out import branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Download and verify authoritative screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/screenshots/password-generator
          base='https://raw.githubusercontent.com/StanleyLl0yd/password-generator/dee1334dc6ec49ab2d442de3a47c491005854a18/store-assets/rustore/screenshots'

          curl --fail --silent --show-error --location "$base/01-generator.png" -o assets/screenshots/password-generator/generator.png
          curl --fail --silent --show-error --location "$base/02-about.png" -o assets/screenshots/password-generator/about.png
          curl --fail --silent --show-error --location "$base/03-custom-password.png" -o assets/screenshots/password-generator/custom-password.png

          test "$(git hash-object assets/screenshots/password-generator/generator.png)" = '7c697fd6ea6d76c461da0129ca47dbe3f4b46360'
          test "$(git hash-object assets/screenshots/password-generator/about.png)" = '5df038749975ad05d196da267744953d6db4282e'
          test "$(git hash-object assets/screenshots/password-generator/custom-password.png)" = '31e4c2f8a028bbffd9f38fd2c93314c88791cce9'

      - name: Commit verified assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-password-generator-assets.yml
          git add assets/screenshots/password-generator
          git commit -m 'Add verified Password Generator screenshots'
          git push origin "HEAD:${GITHUB_REF_NAME}"
