name: Patch My Cycle gallery

on:
  push:
    branches:
      - portfolio/my-cycle-real-gallery-2026-09-16

permissions:
  contents: write

jobs:
  patch-gallery:
    name: patch-gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gallery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Replace placeholders with verified screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('apps/my-cycle/index.html')
          html = page.read_text(encoding='utf-8')
          start_marker = '    <section class="section"><div class="container"><div class="section-heading compact"><div><p class="eyebrow"><span class="lang-en">Product UI</span><span class="lang-ru">Интерфейс приложения</span></p>'
          next_marker = '    <section class="section muted-section"><div class="container"><div class="section-heading compact"><div><p class="eyebrow"><span class="lang-en">Diary first</span><span class="lang-ru">Сначала дневник</span></p>'
          start = html.index(start_marker)
          end = html.index(next_marker, start)
          replacement = '''    <section class="section"><div class="container"><div class="section-heading compact"><div><p class="eyebrow"><span class="lang-en">Product UI</span><span class="lang-ru">Интерфейс приложения</span></p><h2><span class="lang-en">Verified My Cycle 1.4.0 captures.</span><span class="lang-ru">Проверенные снимки My Cycle 1.4.0.</span></h2></div></div><p class="screenshot-note"><span class="lang-en">Generated by the product repository's deterministic RuStore screenshot workflow from real My Cycle 1.4.0 UI and validated before publication. The captures use debug-only deterministic demo data and contain no Android System UI.</span><span class="lang-ru">Снимки созданы детерминированным RuStore-workflow из реального интерфейса My Cycle 1.4.0 и проверены валидатором перед публикацией. Используются только детерминированные демонстрационные данные debug-сборки, Android System UI отсутствует.</span></p><div class="screenshot-gallery" tabindex="0" aria-label="My Cycle screenshots"><figure class="screenshot-card"><img src="/assets/screenshots/my-cycle/today.png" alt="My Cycle Today screen with current status and approximate forecast" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">Today</span><span class="lang-ru">Сегодня</span></figcaption></figure><figure class="screenshot-card"><img src="/assets/screenshots/my-cycle/calendar.png" alt="My Cycle calendar with history and predicted range" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">Calendar</span><span class="lang-ru">Календарь</span></figcaption></figure><figure class="screenshot-card"><img src="/assets/screenshots/my-cycle/statistics.png" alt="My Cycle recent cycle statistics" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">Statistics</span><span class="lang-ru">Статистика</span></figcaption></figure><figure class="screenshot-card"><img src="/assets/screenshots/my-cycle/insights.png" alt="My Cycle recurring symptom patterns" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">Insights</span><span class="lang-ru">Закономерности</span></figcaption></figure><figure class="screenshot-card"><img src="/assets/screenshots/my-cycle/privacy-report.png" alt="My Cycle privacy controls and local PDF report" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">Privacy &amp; local report</span><span class="lang-ru">Приватность и локальный отчёт</span></figcaption></figure></div></div></section>\n\n'''
          page.write_text(html[:start] + replacement + html[end:], encoding='utf-8')

          products = Path('data/products.json')
          text = products.read_text(encoding='utf-8')
          old = '      "plannedScreenshots": ["Today", "Diary/calendar", "History/statistics", "Widget", "Backup/export", "Privacy/biometric lock"]'
          new = '''      "screenshots": [
                {"src": "/assets/screenshots/my-cycle/today.png", "label": "Today"},
                {"src": "/assets/screenshots/my-cycle/calendar.png", "label": "Calendar"},
                {"src": "/assets/screenshots/my-cycle/statistics.png", "label": "Statistics"},
                {"src": "/assets/screenshots/my-cycle/insights.png", "label": "Insights"},
                {"src": "/assets/screenshots/my-cycle/privacy-report.png", "label": "Privacy and local report"}
              ]'''
          if text.count(old) != 1:
              raise SystemExit('My Cycle plannedScreenshots block not found exactly once')
          products.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-off workflow and verify site
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-my-cycle-gallery.yml
          python3 scripts/security_audit.py
          python3 scripts/site_audit.py

      - name: Commit gallery wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/my-cycle/index.html data/products.json
          git commit -m 'Wire verified My Cycle gallery'
          git push origin "HEAD:${GITHUB_REF_NAME}"
