name: Patch Password Generator gallery

on:
  push:
    branches:
      - portfolio/password-generator-real-gallery-2026-09-16

permissions:
  contents: write

jobs:
  patch-gallery:
    name: patch-gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gallery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Replace placeholders with verified screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('apps/password-generator/index.html')
          html = page.read_text(encoding='utf-8')
          start_marker = '    <section class="section"><div class="container"><div class="section-heading compact"><div><p class="eyebrow"><span class="lang-en">Product UI</span><span class="lang-ru">Интерфейс приложения</span></p>'
          next_marker = '    <section class="section"><div class="container"><div class="section-heading compact"><div><p class="eyebrow"><span class="lang-en">Privacy by design</span><span class="lang-ru">Приватность по замыслу</span></p>'
          start = html.index(start_marker)
          end = html.index(next_marker, start)
          replacement = '''    <section class="section"><div class="container"><div class="section-heading compact"><div><p class="eyebrow"><span class="lang-en">Product UI</span><span class="lang-ru">Интерфейс приложения</span></p><h2><span class="lang-en">Verified product captures.</span><span class="lang-ru">Проверенные снимки приложения.</span></h2></div></div><p class="screenshot-note"><span class="lang-en">Official RuStore screenshots committed in the Password Generator repository. They are shown here unchanged as product UI.</span><span class="lang-ru">Официальные скриншоты RuStore из репозитория Password Generator. Здесь они показаны без изменения интерфейса приложения.</span></p><div class="screenshot-gallery" tabindex="0" aria-label="Password Generator screenshots"><figure class="screenshot-card"><img src="/assets/screenshots/password-generator/generator.png" alt="Password Generator main generator screen" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">Generator</span><span class="lang-ru">Генератор</span></figcaption></figure><figure class="screenshot-card"><img src="/assets/screenshots/password-generator/about.png" alt="Password Generator About screen" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">About</span><span class="lang-ru">О приложении</span></figcaption></figure><figure class="screenshot-card"><img src="/assets/screenshots/password-generator/custom-password.png" alt="Password Generator custom password screen" width="1080" height="1920" loading="lazy" decoding="async"><figcaption><span class="lang-en">Custom password</span><span class="lang-ru">Настройка пароля</span></figcaption></figure></div></div></section>\n\n'''
          page.write_text(html[:start] + replacement + html[end:], encoding='utf-8')

          products = Path('data/products.json')
          text = products.read_text(encoding='utf-8')
          old = '      "plannedScreenshots": ["Generator", "Rules and presets", "Strength analysis", "Clipboard privacy", "Light and dark themes"]'
          new = '''      "screenshots": [
                {"src": "/assets/screenshots/password-generator/generator.png", "label": "Generator"},
                {"src": "/assets/screenshots/password-generator/about.png", "label": "About"},
                {"src": "/assets/screenshots/password-generator/custom-password.png", "label": "Custom password"}
              ]'''
          if text.count(old) != 1:
              raise SystemExit('Password Generator plannedScreenshots block not found exactly once')
          products.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-off workflow and verify site
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-password-generator-gallery.yml
          python3 scripts/security_audit.py
          python3 scripts/site_audit.py

      - name: Commit gallery wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/password-generator/index.html data/products.json
          git commit -m 'Wire verified Password Generator gallery'
          git push origin "HEAD:${GITHUB_REF_NAME}"
