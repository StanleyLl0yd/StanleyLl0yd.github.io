name: Suno API CI

on:
  pull_request:
    paths:
      - "tools/suno/**"
      - "tools/suno-api/**"
      - ".github/workflows/suno-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tools/suno/**"
      - "tools/suno-api/**"
      - ".github/workflows/suno-api-ci.yml"

concurrency:
  group: suno-api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: suno-api-node
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/suno-api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Diagnose current Suno media origin
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          const id = '0891f613-c72e-4b16-856c-92d4b9311f68';
          const response = await fetch('https://studio-api.prod.suno.com/api/clip/' + id, {
            headers: {
              'User-Agent': 'Mozilla/5.0',
              'Accept': 'application/json, text/plain, */*',
              'Origin': 'https://suno.com',
              'Referer': 'https://suno.com/song/' + id,
            },
          });
          console.log('clip status', response.status);
          const clip = await response.json();
          const summarize = (item) => {
            let host = '';
            try { host = new URL(item?.url || '').hostname; } catch {}
            return {
              host,
              content_type: item?.content_type || '',
              delivery: item?.delivery || '',
              encoding: item?.encoding || '',
            };
          };
          console.log('media_urls', JSON.stringify((clip.media_urls || []).map(summarize)));
          console.log('audio_url', summarize({ url: clip.audio_url, content_type: 'legacy' }));
          for (const [name, value] of Object.entries({
            image_url: clip.image_url,
            image_large_url: clip.image_large_url,
          })) {
            let host = '';
            try { host = new URL(value || '').hostname; } catch {}
            console.log(name, host);
          }
          NODE

      - name: Verify vendored lamejs
        run: |
          set -euo pipefail
          test "$(git hash-object ../suno/vendor/lame.min.js)" = "8dc6b0726388ff75bec69ac55ac5a6cc49e61093"
          test "$(git hash-object ../suno/vendor/LICENSE.lamejs)" = "e456b65d30e5df56ba66cef91716bdc35085463e"

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test
