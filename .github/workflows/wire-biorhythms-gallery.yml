name: Wire Biorhythms gallery

on:
  push:
    branches:
      - portfolio/biorhythms-real-screenshots

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.2
        with:
          ref: portfolio/biorhythms-real-screenshots

      - name: Wire verified gallery
        run: |
          set -euo pipefail
          python3 scripts/tmp_wire_biorhythms.py
          python3 scripts/security_audit.py
          python3 scripts/site_audit.py

      - name: Commit product wiring and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/wire-biorhythms-gallery.yml scripts/tmp_wire_biorhythms.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/biorhythms/index.html data/products.json .github/workflows/wire-biorhythms-gallery.yml scripts/tmp_wire_biorhythms.py
          git commit -m 'Show verified Biorhythms 1.7.0 screenshots'
          git push origin HEAD:portfolio/biorhythms-real-screenshots
